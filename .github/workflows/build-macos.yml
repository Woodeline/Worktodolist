# 在 GitHub 的 macOS 云主机上编译 Worktodolist.app
#
# 触发方式三选一：
#   1. 推送标签  git push origin v1.1.0   → 自动构建，并把 zip 挂到该版本的 Release 上
#   2. 推送 main（且改动落在下方 paths 内）→ 自动构建，只传 Artifacts
#      paths 过滤是刻意加的：否则改个文档也要烧掉几分钟的 macOS runner 时间。
#      不想让它跑时，直接在 GitHub 的 Actions 页面停用该 workflow 即可。
#   3. 手动      仓库页面 → Actions → "Build macOS APP" → Run workflow
#
# 产物：Worktodolist-macos.zip（内含 Worktodolist.app）
#
# 两个坑，都是本地踩过的，CI 上一样存在：
#   1. src-tauri/rust-toolchain.toml 把通道钉在 stable-x86_64-pc-windows-msvc
#      （Windows 必须走 MSVC，理由见该文件注释）。macOS runner 上直接跑 cargo 会报
#      "target tuple in channel name"。解法是用 RUSTUP_TOOLCHAIN 覆盖 —— 环境变量
#      优先级高于工具链文件，所以不用改仓库里的文件，Windows 侧完全不受影响。
#   2. .app 是个目录包，不能直接当 artifact 上传，要先 ditto 成 zip。

name: Build macOS APP

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'todolist-gui/src/**'
      - 'todolist-gui/src-tauri/**'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      RUSTUP_TOOLCHAIN: stable-aarch64-apple-darwin
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 必须是 22+：qa-css-check.mjs / qa-hooks.mjs 用了 node:fs 的 globSync（Node 22 才有），
      # Node 20 下 test:ui 直接 SyntaxError。理由同 Windows 流水线。
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: todolist-gui/package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: todolist-gui/src-tauri

      # @esbuild/win32-x64（Windows 构建要用）已挪进 optionalDependencies：
      # 平台不匹配时 npm 只是跳过，不再抛 EBADPLATFORM，所以这里不需要 --force。
      - name: 安装前端依赖
        working-directory: todolist-gui
        run: npm ci

      # 测试门禁放在 Rust 编译之前：失败就尽早退出，不烧几分钟的编译时间。
      # test:guard 会以 JSON reporter 重跑一遍 vitest 并核对磁盘上的测试文件数，
      # 所以它本身就是全量单测（顺带拦 vitest 偶发丢文件的「假绿」），不必再单独跑 npm test。
      - name: 测试门禁（单测 / 完整性 / NL 词表 / CSS·对比度·Hooks）
        working-directory: todolist-gui
        run: npm run test:guard && npm run test:nl && npm run test:ui

      # 同 Windows：不走 npm run tauri:build，见那边注释（.bin 软链在部分安装方式下缺失）。
      - name: 编译 Tauri 应用
        working-directory: todolist-gui
        run: node node_modules/@tauri-apps/cli/tauri.js build

      - name: 打成 zip（保留 .app 的包结构）
        working-directory: todolist-gui/src-tauri/target/release/bundle/macos
        run: ditto -c -k --keepParent Worktodolist.app Worktodolist-macos.zip

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: Worktodolist-macos
          path: todolist-gui/src-tauri/target/release/bundle/macos/Worktodolist-macos.zip
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: todolist-gui/src-tauri/target/release/bundle/macos/Worktodolist-macos.zip
