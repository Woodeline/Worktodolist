# 在 GitHub 的 Windows 云主机上编译 Worktodolist 的 exe（NSIS 安装包）
#
# 触发方式二选一：
#   1. 推送标签  git push origin v1.1.0   → 自动构建，并把 exe 挂到该版本的 Release 上
#   2. 手动      仓库页面 → Actions → "Build Windows EXE" → Run workflow
#                在这种方式下只上传 Artifacts，不建 Release（没有标签可挂）
#
# 产物：
#   todolist-gui/src-tauri/target/release/bundle/nsis/Worktodolist_<版本>_x64-setup.exe

name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: todolist-gui/package-lock.json

      # rust-toolchain.toml 把通道钉成 stable-x86_64-pc-windows-msvc（Windows 必须走
      # MSVC 而不是 GNU，理由见该文件注释）。windows-latest 的默认 host 三元组正好
      # 就是这个，所以这里装 stable 即匹配得上；显式声明 targets 是为了防止 runner
      # 镜像将来换掉默认 target 时静默失配。
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: todolist-gui/src-tauri

      - name: 安装前端依赖
        working-directory: todolist-gui
        run: npm ci

      # 这里刻意不走 `npm run tauri:build`：@tauri-apps/cli 的 node_modules/.bin 软链
      # 在部分安装方式下不会建立（本机实测就缺，表现为 `tauri: command not found`）。
      # 直接调 CLI 的入口文件则与安装方式无关。
      - name: 编译 Tauri 应用
        working-directory: todolist-gui
        run: node node_modules/@tauri-apps/cli/tauri.js build

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: Worktodolist-windows
          path: |
            todolist-gui/src-tauri/target/release/Worktodolist.exe
            todolist-gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            todolist-gui/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
