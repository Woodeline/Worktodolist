# 手动触发：在 GitHub 的 Windows 云主机上编译 Worktodolist 的 exe
# 使用方法：仓库页面 → Actions 标签页 → 左侧选 "Build Windows EXE" → Run workflow
# 构建完成后在该次运行页面底部的 Artifacts 区下载 Worktodolist-windows.zip
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: todolist-gui/package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: todolist-gui/src-tauri

      - name: 安装前端依赖
        working-directory: todolist-gui
        run: npm ci

      - name: 编译 Tauri 应用
        working-directory: todolist-gui
        run: npm run tauri:build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Worktodolist-windows
          path: |
            todolist-gui/src-tauri/target/release/Worktodolist.exe
            todolist-gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
