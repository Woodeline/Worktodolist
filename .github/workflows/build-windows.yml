# 在 GitHub 的 Windows 云主机上编译 Worktodolist 的 exe（NSIS 安装包）
#
# 触发方式三选一：
#   1. 推送标签  git push origin v1.1.0   → 自动构建，并把 exe 挂到该版本的 Release 上
#   2. 手动      仓库页面 → Actions → "Build Windows EXE" → Run workflow
#                在这种方式下只上传 Artifacts，不建 Release（没有标签可挂）
#   3. Pull Request（R-12）：**只跑测试语义**（单测 / 静态门禁 / 前端构建），
#                不编译 Rust、不产出安装包、绝不碰 Release。
#
# 产物：
#   todolist-gui/src-tauri/target/release/bundle/nsis/Worktodolist_<版本>_x64-setup.exe

name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  # PR 门禁走独立的 test-windows job：出包要烧掉几分钟的 Windows runner + Rust 编译，
  # 而 PR 只需要知道「这套改动过不过门禁」。所以这里不挂 push.branches —— 全分支的
  # 单测门禁由 ci.yml（ubuntu）负责，Windows 侧只补「平台相关差异」这一层。
  pull_request:
    branches:
      - main
    paths:
      - 'todolist-gui/src/**'
      - 'todolist-gui/src-tauri/**'
      - 'todolist-gui/package.json'
      - 'todolist-gui/package-lock.json'
      - 'todolist-gui/vite.config.js'
      - 'todolist-gui/index.html'
      - 'todolist-gui/scripts/**'
      - '.gitattributes'
      - 'AGENTS.md'

permissions:
  contents: write

jobs:
  # ——— PR：只验证，不产出 ———
  test-windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: todolist-gui/package-lock.json

      - name: 安装前端依赖
        working-directory: todolist-gui
        run: npm ci

      # 与 ci.yml 同一口径：test:guard 内部已重跑全量 vitest，不再叠裸的测试命令。
      - name: 测试门禁（单测 / 完整性 / CSS·对比度·Hooks）
        working-directory: todolist-gui
        run: npm run test:guard && npm run test:ui

      - name: 构建（vite build → dist/）
        working-directory: todolist-gui
        run: npm run build

  # ——— 出包：只在 tag / 手动触发时跑 ———
  build-windows:
    # 双保险：PR 根本不进这个 job；即使将来 on 里加了别的触发器，
    # 下面 Release 步骤还有 startsWith(github.ref, 'refs/tags/') 这道锁。
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 必须是 22+：scripts/qa-css-check.mjs 与 qa-hooks.mjs 用了 node:fs 的 globSync，
      # 该导出 Node 22 才有，Node 20 会直接 SyntaxError（门禁整步失败、构建中断）。
      # Node 20 本身也已 EOL（2026-04 结束维护），行动镜像早就提示 deprecated。
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: todolist-gui/package-lock.json

      # rust-toolchain.toml 把通道钉成 stable-x86_64-pc-windows-msvc（Windows 必须走
      # MSVC 而不是 GNU，理由见该文件注释）。windows-latest 的默认 host 三元组正好
      # 就是这个，所以这里装 stable 即匹配得上；显式声明 targets 是为了防止 runner
      # 镜像将来换掉默认 target 时静默失配。
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: todolist-gui/src-tauri

      - name: 安装前端依赖
        working-directory: todolist-gui
        run: npm ci

      # 测试门禁放在 Rust 编译之前：失败就尽早退出，不烧几分钟的编译时间。
      # test:guard 会以 JSON reporter 重跑一遍 vitest 并核对磁盘上的测试文件数，
      # 所以它本身就是全量单测（顺带拦 vitest 偶发丢文件的「假绿」），不必再单独跑 npm test。
      - name: 测试门禁（单测 / 完整性 / CSS·对比度·Hooks）
        working-directory: todolist-gui
        run: npm run test:guard && npm run test:ui

      # 这里刻意不走 `npm run tauri:build`：@tauri-apps/cli 的 node_modules/.bin 软链
      # 在部分安装方式下不会建立（本机实测就缺，表现为 `tauri: command not found`）。
      # 直接调 CLI 的入口文件则与安装方式无关。
      - name: 编译 Tauri 应用
        working-directory: todolist-gui
        run: node node_modules/@tauri-apps/cli/tauri.js build

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: Worktodolist-windows
          path: |
            todolist-gui/src-tauri/target/release/Worktodolist.exe
            todolist-gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            todolist-gui/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
